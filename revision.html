<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      span {
        display: inline-block;
        margin: 10px;
        width: 200px;
      }
      span:hover{
        box-shadow: 0px 0px 5px 5px purple;
      }

      /* z-index */
      .container{
        border: 2px solid blue;
        padding: 15px 10px;
        position: relative;
      }
      .container div{
        width: 300px;
        height: 300px;
        font-size: 40px;
      }
      .box1{
        background-color: orange;
        position: absolute;
        top: 200px;
        z-index: 5;
    }
      .box2{
        background-color: lightseagreen;
        position: relative;
        z-index: 10;
    }
    </style>
  </head>
  <body>
    <!-- an inline element -->
    <span>this is some sample content</span>
    <a href="#">Hyperlink</a>

    <!-- z-index with positions -->
    <div class="container">
        <h1>Z-index with css positions</h1>
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div>
    </div>
  </body>
</html>
